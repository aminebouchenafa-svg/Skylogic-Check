name: Contrôle

# Vérifie les versions poussées sur les branches de travail. La publication
# de main est assurée par le workflow « Déploiement GitHub Pages ».
on:
  push:
    branches: ['claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
