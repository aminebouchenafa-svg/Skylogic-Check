name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le job écrit la version compilée dans la branche gh-pages, que GitHub
# publie sans qu'aucun réglage ne soit nécessaire dans le dépôt.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Publier dans la branche gh-pages
        run: |
          cd dist
          # Empêche GitHub de faire passer le site par Jekyll.
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publication de ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
